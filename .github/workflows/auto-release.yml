# Builds, signs, and publishes a GitHub Release on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GH_TOKEN         a token that can push to main and create releases (contents: write)
#   CSC_LINK         the code-signing certificate as a Base64 string (the .pfx file, encoded)
#   CSC_KEY_PASSWORD the password of that .pfx certificate
#
# If CSC_LINK is empty, electron-builder skips signing and the installer is unsigned.
# See "Releases & code signing" in README.md for how to create the Base64 value.

name: Auto Build & Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Increment Patch Version
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          LATEST=${LATEST_TAG#v}
          CURRENT=$(node -p "require('./package.json').version")

          # Skip the bump when package.json is already ahead of the latest tag.
          HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -n 1)
          if [ "$HIGHEST" = "$CURRENT" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "package.json is $CURRENT, newer than $LATEST_TAG. Skipping the bump."
            exit 0
          fi

          # Patch number of the latest tag, plus one.
          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          npm version "$NEW" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: release v$NEW [skip ci]"
          git tag "v$NEW"
          git push origin main
          git push origin "v$NEW"

      - name: Build & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release
