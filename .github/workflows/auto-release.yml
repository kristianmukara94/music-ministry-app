# Builds, signs, and publishes a GitHub Release on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GH_TOKEN         a token that can push to main and create releases (contents: write)
#   CSC_LINK         the code-signing certificate as a Base64 string (the .pfx file, encoded)
#   CSC_KEY_PASSWORD the password of that .pfx certificate
#
# If CSC_LINK is empty, electron-builder skips signing and the installer is unsigned.
# See "Releases & code signing" in README.md for how to create the Base64 value.

name: Auto Build & Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Increment Patch Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s [skip ci]"
          git push

      - name: Build & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release
