<!doctype html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Song list · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/planner.css">
<script type="module" src="js/songs.js"></script>
</head>
<body class="songs-page">
<div class="shell" style="display: flex; flex-wrap: wrap; background: #0f0407; color: #f7eef0; font-family: 'Archivo','Segoe UI',system-ui,sans-serif">

  <div data-sidebar="songs"></div>

  <main class="main" style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">

    <header style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #ecc98a">SONGS · READ ONLY</span>
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 48px; line-height: 1.02">Song list</h1>
      <p style="margin: 0; max-width: 620px; font-size: 15px; line-height: 1.55; color: #dbb3bf">Titles, categories and languages from the church laptop. Lyrics stay on the laptop. To add or edit a song, open the desktop app.</p>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <label style="flex: 1 1 280px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid #55202f; border-radius: 10px; background: #150610">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b48d99" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="song-search" type="search" aria-label="Search songs" placeholder="Search by title" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #f7eef0; font-size: 14px">
      </label>
      <div id="langs" role="group" aria-label="Language" style="display: flex; flex-wrap: wrap; gap: 6px"></div>
      <span id="synced" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #b48d99"></span>
    </div>

    <div id="cats" role="group" aria-label="Category" style="display: flex; flex-wrap: wrap; gap: 8px"></div>

    <div style="border: 1px solid #3a1523; border-radius: 16px; background: #1b0a13; overflow: hidden">
      <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 12px 18px; background: #22101a; border-bottom: 1px solid #3a1523; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #b48d99">
        <span style="flex: 3 1 220px">TITLE</span>
        <span style="flex: 2 1 160px">CATEGORY</span>
        <span style="flex: 1 1 90px">LANGUAGE</span>
        <span style="flex: 0 0 72px; text-align: right">KEY</span>
      </div>
      <div id="song-rows"></div>
    </div>
    <span id="footer" aria-live="polite" style="font-size: 13px; color: #b48d99"></span>
  </main>
</div>
</body>
</html>
