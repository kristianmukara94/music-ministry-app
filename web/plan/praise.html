<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/theme-init.js"></script>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Praise &amp; Worship · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme-tokens.css">
<link rel="stylesheet" href="../css/planner.css">
<script type="module" src="../js/praise.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main planner-main lp-page pw-page">

    <div data-planner-header></div>

    <header class="pe-head" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
        <div class="pe-title-block">
          <span id="eyebrow" class="eyebrow"></span>
          <input id="plan-title" class="pe-title-input" type="text" maxlength="120" autocomplete="off" spellcheck="false" aria-label="Plan title" disabled>
          <div class="pe-badges">
            <span id="date-badge" class="pe-badge"></span>
            <span class="pe-badge is-kind">Praise &amp; Worship</span>
            <span id="fill-badge" class="pe-badge is-progress" aria-live="polite"></span>
          </div>
        </div>
        <div class="plan-actions" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span id="status-pill" class="plan-status" data-state="idle" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600"><span class="status-dot"></span><span id="status" aria-live="polite"></span></span>
          <button id="plan-appearance" type="button" class="btn-quiet pa-btn" aria-haspopup="dialog" disabled></button>
          <button id="print" type="button" class="btn-quiet" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
            Print Lineup
          </button>
          <button id="duplicate" type="button" class="btn-quiet pe-action">Duplicate Plan</button>
          <button id="delete" type="button" class="btn-quiet pe-action is-danger">Delete Plan</button>
          <button id="discard" type="button" class="btn-quiet" style="height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600">Discard changes</button>
          <button id="save" type="button" class="btn-primary" title="Ctrl + S, or Cmd + S on a Mac" aria-keyshortcuts="Control+S Meta+S" style="height: 44px; padding: 0 22px; font-size: 14px; font-weight: 700">Save plan</button>
        </div>
      </div>
      <p id="view-only" hidden style="margin: 0; font-size: 13px; color: var(--muted)"></p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600">Songs <span id="songs-label" style="font-family: 'JetBrains Mono', monospace; margin-left: 8px; color: var(--eyebrow)"></span></span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600">Total time <span id="total-label" aria-live="polite" style="font-family: 'JetBrains Mono', monospace; margin-left: 8px; color: var(--eyebrow)"></span></span>
        <span id="segments-label" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600"></span>
      </div>
    </header>

    <div class="lp-workspace pw-workspace">

      <!-- Left: the Library (song titles, prayer titles and Scripture references only). -->
      <aside id="library" class="lp-library pw-library" aria-label="Library">
        <div class="pw-lib-head"><h2 class="pw-lib-title">Library</h2><span id="lib-target" aria-live="polite"></span></div>
        <div id="lib-search"></div>
        <div id="lib-tabs" class="pw-tabs" role="tablist" aria-label="Library"></div>
        <div id="lib-actions"></div>
        <div id="lib-panel" class="lp-lib-panel pw-lib-panel" role="tabpanel"></div>
        <p id="lib-status" class="lp-lib-status" aria-live="polite"></p>
      </aside>

      <!-- Right: how ready the plan is, then the LINEUP. -->
      <div class="lp-builder pw-builder">
        <button type="button" id="browse-library" class="lp-tool lp-browse">Browse Library</button>
        <section id="readiness" class="pw-readiness" aria-label="Readiness">
          <div class="pw-readiness-top">
            <span class="eyebrow">READINESS</span>
            <h2 id="readiness-headline" aria-live="polite" class="pw-readiness-headline"></h2>
          </div>
          <div class="pw-readiness-bar"><span id="readiness-fill" class="time-bar-fill"></span></div>
          <ul id="readiness-checks" class="pw-readiness-list"></ul>
        </section>
        <section class="pw-lineup" aria-label="Lineup">
          <div id="lineup-head" class="pw-lineup-head"></div>
          <div id="add-segment" hidden></div>
          <div id="segments" class="pw-sections"></div>
          <p class="pw-foot">Songs come from the church laptop. Lyrics, prayer words and Bible text are shown from the laptop, never kept here.</p>
        </section>
      </div>
    </div>
  </main>
</div>

<dialog id="delete-dialog" class="modal" aria-labelledby="delete-title">
  <div class="dialog-body">
    <h2 id="delete-title">Delete this plan?</h2>
    <p id="delete-text"></p>
    <p id="delete-error" class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="quiet" autofocus>Keep plan</button>
      <button type="button" id="delete-confirm" class="danger">Delete plan</button>
    </div>
  </div>
</dialog>
<section id="setlist-print" class="setlist-print" aria-hidden="true"></section>
</body>
</html>
