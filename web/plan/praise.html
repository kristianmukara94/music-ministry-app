<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/theme-init.js"></script>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Praise &amp; Worship · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/planner.css">
<script type="module" src="../js/praise.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main" style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">

    <header style="display: flex; flex-direction: column; gap: 16px">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        All plans
      </a>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="eyebrow" class="eyebrow"></span>
          <h1 id="title" class="page-title"></h1>
        </div>
        <div class="plan-actions" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span id="status-pill" class="plan-status" data-state="idle" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600"><span class="status-dot"></span><span id="status" aria-live="polite"></span></span>
          <button id="print" type="button" class="btn-quiet" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
            Print Setlist
          </button>
          <button id="discard" type="button" class="btn-quiet" style="height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600">Discard changes</button>
          <button id="save" type="button" class="btn-primary" title="Ctrl + S, or Cmd + S on a Mac" aria-keyshortcuts="Control+S Meta+S" style="height: 44px; padding: 0 22px; font-size: 14px; font-weight: 700">Save plan</button>
        </div>
      </div>
      <p id="view-only" hidden style="margin: 0; font-size: 13px; color: var(--muted)"></p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600">Songs <span id="songs-label" style="font-family: 'JetBrains Mono', monospace; margin-left: 8px; color: var(--eyebrow)"></span></span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600">Total time <span id="total-label" aria-live="polite" style="font-family: 'JetBrains Mono', monospace; margin-left: 8px; color: var(--eyebrow)"></span></span>
        <span id="segments-label" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600"></span>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">
      <section id="segments" aria-label="Segments" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px"></section>
      <aside id="readiness" aria-label="Readiness" style="flex: 1 1 320px; min-width: 0; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; padding: 22px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface)">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span class="eyebrow">READINESS</span>
          <h2 id="readiness-headline" aria-live="polite" class="section-title" style="font-size: 24px"></h2>
        </div>
        <div style="height: 8px; border-radius: 99px; background: var(--border); overflow: hidden">
          <span id="readiness-fill" class="time-bar-fill"></span>
        </div>
        <ul id="readiness-checks" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px"></ul>
        <div style="padding-top: 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px">
          <span class="eyebrow">TIME BY SECTION</span>
          <div id="section-bars" style="display: flex; flex-direction: column; gap: 12px"></div>
        </div>
        <p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted)">Songs come from the church laptop. Lyrics and slides are prepared in the desktop app.</p>
      </aside>
    </div>
  </main>
</div>
<section id="setlist-print" class="setlist-print" aria-hidden="true"></section>
</body>
</html>
