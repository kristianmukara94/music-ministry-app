<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>New plan · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/planner.css">
<script type="module" src="../js/new-plan.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main" style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">

    <header style="display: flex; flex-direction: column; gap: 16px">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        All plans
      </a>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="eyebrow">ASSUMPTION PARISH · MUSIC MINISTRY</span>
        <h1 class="page-title">New plan</h1>
      </div>
    </header>

    <p id="new-plan-denied" hidden style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text)">Only a planner or an admin can create a plan. Ask a planner to make it.</p>

    <form id="new-plan-form" novalidate hidden style="display: flex; flex-direction: column; gap: 20px; padding: 22px; max-width: 640px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface)">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: var(--text)">Name</span>
        <input id="plan-name" type="text" maxlength="120" autocomplete="off" placeholder="e.g. All Saints, Sunday Holy Mass" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; outline: 0">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: var(--text)">Date</span>
        <input id="plan-date" type="date" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; outline: 0">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: var(--text)">Type</span>
        <select id="plan-kind" style="height: 46px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; outline: 0">
          <option value="mass">Holy Mass</option>
          <option value="pw">Praise &amp; Worship</option>
        </select>
      </label>
      <p id="new-plan-status" role="alert" style="margin: 0; min-height: 20px; font-size: 13px; line-height: 1.5; color: var(--danger)"></p>
      <div>
        <button id="new-plan-submit" type="submit" class="btn-primary" style="height: 44px; padding: 0 22px; font-size: 14px; font-weight: 700">Create plan</button>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted)">Songs and readings are chosen in the editor. Lyrics and slides are prepared in the desktop app.</p>
    </form>
  </main>
</div>
</body>
</html>
