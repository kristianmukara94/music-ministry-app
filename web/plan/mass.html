<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/theme-init.js"></script>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Holy Mass plan · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme-tokens.css">
<link rel="stylesheet" href="../css/planner.css">
<script type="module" src="../js/mass.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main planner-main">

    <div data-planner-header></div>

    <header class="pe-head" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
        <div class="pe-title-block">
          <span id="eyebrow" class="eyebrow"></span>
          <input id="plan-title" class="pe-title-input" type="text" maxlength="120" autocomplete="off" spellcheck="false" aria-label="Plan title" disabled>
          <div class="pe-badges">
            <span id="date-badge" class="pe-badge"></span>
            <span class="pe-badge is-kind">Holy Mass</span>
            <span id="fill-badge" class="pe-badge is-progress" aria-live="polite"></span>
          </div>
        </div>
        <div class="plan-actions" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <span class="plan-status" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--pill-text); font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--pill-text)"></span><span id="status" aria-live="polite"></span></span>
          <button id="duplicate" type="button" class="btn-quiet pe-action">Duplicate Plan</button>
          <button id="delete" type="button" class="btn-quiet pe-action is-danger">Delete Plan</button>
          <button id="discard" type="button" class="btn-quiet" style="height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600">Discard changes</button>
          <button id="save" type="button" class="btn-primary" title="Ctrl + S, or Cmd + S on a Mac" aria-keyshortcuts="Control+S Meta+S" style="height: 44px; padding: 0 22px; font-size: 14px; font-weight: 700">Save plan</button>
        </div>
      </div>
      <p id="view-only" hidden style="margin: 0; font-size: 13px; color: var(--muted)"></p>
      <nav id="schedule-switcher" class="bc-switcher" aria-label="Holy Masses on this day"></nav>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600">Songs <span id="songs-label" style="font-family: 'JetBrains Mono', monospace; margin-left: 8px; color: var(--eyebrow)"></span></span>
        <span style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600">Readings <span id="readings-label" style="font-family: 'JetBrains Mono', monospace; margin-left: 8px; color: var(--eyebrow)"></span></span>
        <span id="steps-label" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600"></span>
      </div>

      <section class="plan-details bc-panel" aria-label="Holy Mass time and language" style="flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 16px 28px">
        <p class="bc-eyebrow" style="flex: 1 1 100%">Holy Mass schedule</p>
        <div id="schedule-fields" style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px"></div>
        <div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
          <span id="language-label" class="bc-label">Readings &amp; responses</span>
          <div id="language" class="segmented" role="radiogroup" aria-labelledby="language-label" style="display: flex; gap: 6px; padding: 4px; border: 1px solid var(--bc-border-hover); border-radius: 12px; background: var(--bc-cell)"></div>
        </div>
        <div id="schedule-conflict" style="flex: 1 1 100%" hidden></div>
        <p id="details-note" style="flex: 1 1 100%; margin: 0; font-size: 12px; line-height: 1.5; color: var(--bc-muted)"></p>
      </section>
    </header>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px">
      <section id="steps" aria-label="Holy Mass slots and steps" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px"></section>
      <aside id="drawer" class="drawer" aria-label="Choose for this row" style="flex: 1 1 360px; min-width: 0; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; padding: 22px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface)"></aside>
    </div>
  </main>
</div>

<dialog id="delete-dialog" class="modal" aria-labelledby="delete-title">
  <div class="dialog-body">
    <h2 id="delete-title">Delete this plan?</h2>
    <p id="delete-text"></p>
    <p id="delete-error" class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="quiet" autofocus>Keep plan</button>
      <button type="button" id="delete-confirm" class="danger">Delete plan</button>
    </div>
  </div>
</dialog>
</body>
</html>
