<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/theme-init.js"></script>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Holy Mass plan · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme-tokens.css">
<link rel="stylesheet" href="../css/planner.css">
<script type="module" src="../js/mass.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main planner-main lp-page">

    <!-- SERVICE PLANNING → Liturgical Plan, the three tabs, and Duplicate / Save plan. -->
    <div data-planner-header></div>

    <p id="view-only" class="lp-view-only" hidden></p>

    <!-- What is chosen and what the day still needs. -->
    <div id="readiness" class="lp-banner" role="status" aria-live="polite" hidden></div>

    <div class="lp-workspace">

      <!-- Left: the church's songs (titles and categories only), cues and templates. -->
      <aside id="library" class="lp-library" aria-label="Song and resource library">
        <div class="lp-lib-tabs" role="tablist" aria-label="Library" id="lib-tabs"></div>
        <div class="lp-target" id="lib-target" aria-live="polite"></div>
        <div id="lib-panel" class="lp-lib-panel" role="tabpanel"></div>
        <p id="lib-status" class="lp-lib-status" aria-live="polite"></p>
      </aside>

      <!-- Right: the control strip, then the four parts of the Holy Mass. -->
      <div class="lp-builder">
        <section class="lp-strip" aria-label="Holy Mass time and language">
          <div class="lp-strip-row">
            <a id="back-to-calendar" class="lp-back" href="../index.html?cal=mass"><span aria-hidden="true">←</span> Back to Calendar</a>
            <label class="lp-switch">
              <span class="sr-only">Open another Holy Mass plan</span>
              <select id="plan-switch" disabled></select>
            </label>
            <div class="lp-langs">
              <div id="language" class="lp-lang-group" role="radiogroup" aria-label="Readings and responses language"></div>
              <button type="button" id="lang-other" class="lp-lang" aria-pressed="false" title="A Holy Mass in another language">Other</button>
              <input id="lang-other-input" class="lp-lang-input" type="text" maxlength="30" autocomplete="off" aria-label="Custom Holy Mass language" placeholder="Language" hidden>
            </div>
            <button id="delete" type="button" class="lp-icon-btn is-danger" aria-label="Delete Plan" title="Delete Plan">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>

          <div class="lp-title-row">
            <span id="eyebrow" class="lp-eyebrow"></span>
            <div class="lp-title-line">
              <span id="date-badge" class="lp-date"></span>
              <input id="plan-title" class="lp-title-input" type="text" maxlength="120" autocomplete="off" spellcheck="false" aria-label="Plan title" disabled>
            </div>
          </div>

          <div class="lp-strip-row">
            <button type="button" id="print-lineup" class="lp-tool" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
              Print lineup
            </button>
            <button type="button" id="open-templates" class="lp-tool">Templates</button>
            <button type="button" id="browse-songs" class="lp-tool lp-browse">Browse songs</button>
            <button type="button" id="discard" class="lp-tool is-quiet" hidden>Discard changes</button>
          </div>

          <div class="lp-strip-row lp-schedule">
            <nav id="schedule-switcher" class="bc-switcher" aria-label="Holy Masses on this day"></nav>
            <div id="time-popover" class="lp-popover" role="dialog" aria-label="Holy Mass time" hidden></div>
          </div>
          <div id="schedule-conflict" hidden></div>

          <div class="lp-strip-row lp-progress">
            <span id="strip-subtitle" class="lp-strip-subtitle"></span>
            <span id="fill-badge" class="lp-fill" aria-live="polite"></span>
            <button type="button" id="collapse-all" class="lp-tool">Collapse all</button>
          </div>
        </section>

        <div id="steps" class="lp-steps" aria-label="Holy Mass slots"></div>
      </div>
    </div>
  </main>
</div>

<section id="setlist-print" class="setlist-print" aria-hidden="true"></section>

<dialog id="delete-dialog" class="modal" aria-labelledby="delete-title">
  <div class="dialog-body">
    <h2 id="delete-title">Delete this plan?</h2>
    <p id="delete-text"></p>
    <p id="delete-error" class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="quiet" autofocus>Keep plan</button>
      <button type="button" id="delete-confirm" class="danger">Delete plan</button>
    </div>
  </div>
</dialog>
</body>
</html>
