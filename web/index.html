<!doctype html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/theme-init.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Planner · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme-tokens.css">
<link rel="stylesheet" href="css/planner.css">
<script type="module" src="js/plans.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main planner-main">

    <div data-planner-header></div>

    <section aria-label="Plans" style="display: flex; flex-direction: column; gap: 16px">
      <div class="planner-toolbar">
        <div class="view-toggle" role="group" aria-label="Plan layout">
          <button type="button" data-view="calendar" aria-pressed="true" aria-label="Calendar view" title="Calendar view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </button>
          <button type="button" data-view="list" aria-pressed="false" aria-label="List view" title="List view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          </button>
          <button type="button" data-view="grid" aria-pressed="false" aria-label="Grid view" title="Grid view">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
        <div id="list-controls" class="planner-list-controls" hidden>
          <label class="planner-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="plan-search" type="search" aria-label="Search plans" aria-keyshortcuts="/" placeholder="Search plans">
            <kbd class="shortcut-hint" aria-hidden="true">/</kbd>
          </label>
          <label class="planner-sort">
            Sort by
            <select id="plan-sort">
              <option value="date-desc">Plan date (newest)</option>
              <option value="updated-desc">Last updated</option>
              <option value="title-asc">Title (A to Z)</option>
            </select>
          </label>
        </div>
      </div>

      <p id="plan-list-status" class="plan-list-status" role="status"></p>

      <div id="plan-rows" class="plan-list" tabindex="-1"></div>

      <p class="planner-footnote">Plans sync with the church laptop automatically. Open the app and press Sync now to pull the latest. Lyrics, Bible text and media stay on the laptop.</p>
    </section>
  </main>
</div>

<div id="plan-menu" class="plan-menu" role="menu" aria-label="Plan actions" hidden></div>

<dialog id="day-dialog" class="bc-dialog" aria-labelledby="day-dialog-title">
  <div class="bc-dialog-body">
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex: 1; min-width: 0">
        <p id="day-dialog-eyebrow" class="bc-eyebrow">Available Holy Mass Schedules</p>
        <h2 id="day-dialog-title" class="bc-dialog-title"></h2>
        <p id="day-dialog-hint" class="bc-hint" style="margin: 4px 0 0">Pick a Holy Mass to open it, or add another time on this day.</p>
      </div>
      <button type="button" id="day-dialog-close" class="bc-btn-quiet" aria-label="Close">✕</button>
    </div>
    <ul id="day-dialog-list" class="bc-schedules"></ul>
    <div id="day-dialog-actions" class="bc-dialog-actions"></div>
  </div>
</dialog>

<dialog id="new-plan-dialog" class="np-dialog" aria-labelledby="np-heading">
  <!-- The CREATE A PLAN card (js/new-plan-form.js), the same one plan/new.html shows. It carries its own heading and × button. -->
  <div id="new-plan-layout" class="new-plan-layout"></div>
</dialog>

<dialog id="memo-dialog" class="bc-dialog" aria-labelledby="memo-dialog-title">
  <form id="memo-form" class="bc-dialog-body" novalidate>
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex: 1; min-width: 0">
        <p class="bc-eyebrow">Day memo</p>
        <h2 id="memo-dialog-title" class="bc-dialog-title"></h2>
        <p id="memo-dialog-day" class="bc-hint" style="margin: 4px 0 0"></p>
      </div>
      <button type="button" id="memo-dialog-close" class="bc-btn-quiet" aria-label="Close">✕</button>
    </div>
    <label class="bc-field">
      <span class="bc-label">Memo for this day</span>
      <input id="memo-input" class="bc-input" type="text" maxlength="200" autocomplete="off" placeholder="e.g. Choir practice after the evening Holy Mass">
      <span class="bc-hint">Shown on this day in both calendars, for everyone in your church.</span>
    </label>
    <p id="memo-error" class="form-error" role="alert"></p>
    <div class="bc-dialog-actions">
      <button type="submit" id="memo-save" class="bc-btn-gold">Save memo</button>
      <button type="button" id="memo-remove" class="bc-btn-quiet">Remove memo</button>
    </div>
  </form>
</dialog>

<dialog id="delete-dialog" class="modal" aria-labelledby="delete-title">
  <div class="dialog-body">
    <h2 id="delete-title">Delete this plan?</h2>
    <p id="delete-text"></p>
    <p id="delete-error" class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="quiet" autofocus>Keep plan</button>
      <button type="button" id="delete-confirm" class="danger">Delete plan</button>
    </div>
  </div>
</dialog>

<section id="setlist-print" class="setlist-print" aria-hidden="true"></section>
</body>
</html>
