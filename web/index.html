<!doctype html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/theme-init.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Plans · APCCMMA Web Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/planner.css">
<script type="module" src="js/plans.js"></script>
</head>
<body>
<div class="shell" style="display: flex; flex-wrap: wrap">

  <div data-sidebar="plans"></div>

  <main class="main" style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; display: flex; flex-direction: column; gap: 28px">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span class="eyebrow">ASSUMPTION PARISH · MUSIC MINISTRY</span>
        <h1 class="page-title">Plans</h1>
      </div>
      <div id="new-plan-actions" style="display: none; flex-wrap: wrap; gap: 12px">
        <a href="plan/new.html" class="btn-primary" style="height: 44px; padding: 0 18px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New plan
        </a>

      </div>
    </header>

    <section id="summary" aria-label="Summary" style="display: none; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px"></section>

    <section aria-label="Plan list" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <div id="tabs" role="tablist" aria-label="Plan type" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
        <div style="flex: 0 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <label style="flex: 1 1 220px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); min-width: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="plan-search" type="search" aria-label="Search plans" aria-keyshortcuts="/" placeholder="Search plans" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 14px">
            <kbd class="shortcut-hint" aria-hidden="true">/</kbd>
          </label>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted)">
            Sort by
            <select id="plan-sort" style="height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text); font-size: 14px">
              <option value="date-desc">Plan date (newest)</option>
              <option value="updated-desc">Last updated</option>
              <option value="title-asc">Title (A to Z)</option>
            </select>
          </label>
          <div class="view-toggle" role="group" aria-label="Plan layout">
            <button type="button" data-view="list" aria-pressed="true" aria-label="List view" title="List view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            </button>
            <button type="button" data-view="grid" aria-pressed="false" aria-label="Grid view" title="Grid view">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
          </div>
        </div>
      </div>

      <p id="plan-list-status" class="plan-list-status" role="status"></p>

      <div id="plan-rows" class="plan-list" tabindex="-1"></div>

      <p style="margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 720px">Plans sync with the church laptop automatically. Open the app and press Sync now to pull the latest. Lyrics, Bible text and media stay on the laptop.</p>
    </section>
  </main>
</div>

<div id="plan-menu" class="plan-menu" role="menu" aria-label="Plan actions" hidden></div>

<dialog id="delete-dialog" class="modal" aria-labelledby="delete-title">
  <div class="dialog-body">
    <h2 id="delete-title">Delete this plan?</h2>
    <p id="delete-text"></p>
    <p id="delete-error" class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="quiet" autofocus>Keep plan</button>
      <button type="button" id="delete-confirm" class="danger">Delete plan</button>
    </div>
  </div>
</dialog>

<section id="setlist-print" class="setlist-print" aria-hidden="true"></section>
</body>
</html>
