<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Live service controls</title>
    <link rel="stylesheet" href="/remote/remote.css" />
  </head>
  <body>
    <main>
      <section id="pin" class="panel" hidden>
        <form id="pin-form" autocomplete="off">
          <label for="pin-input">Enter the PIN to control the service</label>
          <input id="pin-input" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required />
          <button type="submit">Open</button>
          <p id="pin-error" role="alert"></p>
        </form>
      </section>

      <section id="view" class="panel" hidden aria-live="polite">
        <header>
          <p id="status" class="status">Connecting…</p>
          <h1 id="title"></h1>
          <p id="position" class="position"></p>
        </header>

        <p id="paused" class="paused" role="status" hidden>Paused by operator</p>

        <div class="controls">
          <button id="prev" type="button" class="big-button">Previous slide</button>
          <button id="next" type="button" class="big-button">Next slide</button>
        </div>
        <p id="control-error" class="control-error" role="alert"></p>

        <div id="lines" class="lines" aria-label="Current slide"></div>

        <div class="coming">
          <p class="next-label">Coming up</p>
          <div id="next-lines" class="next-lines"></div>
          <p id="next-slide-empty" class="next-empty" hidden>No more slides in this item</p>
        </div>

        <div id="sections" class="sections" aria-label="Jump to a slide" hidden></div>

        <footer>
          <p class="next-label">Next item</p>
          <p id="next-item" class="next"></p>
        </footer>
      </section>

      <p id="connection" class="connection" role="status" hidden>Cannot reach the laptop. Check that this phone is on the same WiFi.</p>
    </main>
    <script src="/remote/common.js"></script>
    <script src="/remote/remote.js"></script>
  </body>
</html>
