<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Live service</title>
    <link rel="stylesheet" href="/remote/remote.css" />
  </head>
  <body>
    <main>
      <section id="pin" class="panel" hidden>
        <form id="pin-form" autocomplete="off">
          <label for="pin-input">Enter the PIN to follow the service</label>
          <input id="pin-input" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required />
          <button type="submit">Open</button>
          <p id="pin-error" role="alert"></p>
        </form>
      </section>

      <section id="view" class="panel" hidden aria-live="polite">
        <header>
          <p id="status" class="status">Connecting…</p>
          <h1 id="title"></h1>
          <p id="position" class="position"></p>
        </header>
        <div id="lines" class="lines"></div>
        <footer>
          <p class="next-label">Next</p>
          <p id="next" class="next"></p>
        </footer>
      </section>

      <p id="connection" class="connection" role="status" hidden>Cannot reach the laptop. Check that this phone is on the same WiFi.</p>
    </main>
    <script src="/remote/remote.js"></script>
  </body>
</html>
