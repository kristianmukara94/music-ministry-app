<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Live service controls</title>
    <link rel="stylesheet" href="/remote/remote.css" />
  </head>
  <body>
    <main>
      <section id="pin" class="panel" hidden>
        <form id="pin-form" autocomplete="off">
          <label for="pin-input">Enter the PIN to control the service</label>
          <input id="pin-input" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" required />
          <button type="submit">Open</button>
          <p id="pin-error" role="alert"></p>
        </form>
      </section>

      <section id="view" class="panel" hidden aria-live="polite">
        <header>
          <p id="status" class="status">Connecting…</p>
          <h1 id="title"></h1>
          <p id="position" class="position"></p>
        </header>

        <p id="screen-banner" class="screen-banner" role="status" hidden></p>
        <p id="paused" class="paused" role="status" hidden>Paused by operator</p>

        <div class="controls">
          <button id="prev" type="button" class="big-button">Previous slide</button>
          <button id="next" type="button" class="big-button">Next slide</button>
        </div>
        <p id="control-error" class="control-error" role="alert"></p>

        <div class="screen-controls" role="group" aria-label="Screen controls">
          <p class="next-label">Screen controls</p>
          <div class="screen-buttons">
            <button id="welcome" type="button" class="screen-button welcome" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M10 19.5v-5h4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
              <span>Welcome Screen</span>
            </button>
            <button id="blackout" type="button" class="screen-button blackout" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M3 5h18v12H3zM9 21h6M12 17v4M4 3l16 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
              <span>Blackout</span>
            </button>
          </div>
        </div>

        <img id="slide-image" class="slide-image" alt="Current slide" hidden />
        <div id="lines" class="lines" aria-label="Current slide"></div>

        <div class="coming">
          <p class="next-label">Coming up</p>
          <div id="next-lines" class="next-lines"></div>
          <p id="next-slide-empty" class="next-empty" hidden>No more slides in this item</p>
        </div>

        <div id="lineup-panel" hidden>
          <p id="lineup-heading" class="next-label">Lineup</p>
          <div id="lineup" class="lineup" aria-label="Choose what to show"></div>
        </div>

        <div id="sections" class="sections" aria-label="Jump to a slide" hidden></div>

        <footer>
          <p class="next-label">Next item</p>
          <p id="next-item" class="next"></p>
        </footer>
      </section>

      <p id="connection" class="connection" role="status" hidden>Cannot reach the laptop. Check that this phone is on the same WiFi.</p>
    </main>
    <script src="/remote/common.js"></script>
    <script src="/remote/remote.js"></script>
  </body>
</html>
